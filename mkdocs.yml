site_name: Statract
site_description: Estimation, statistical figures, and cost-effectiveness analysis
site_author: MIZUGUCHI Yasuhiko
repo_name: mizuy/statract
repo_url: https://github.com/mizuy/statract
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-mark.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - javascripts/vendor/katex/katex.min.css

extra_javascript:
  - javascripts/vendor/katex/katex.min.js
  - javascripts/vendor/katex/contrib/auto-render.min.js
  - javascripts/katex.js

hooks:
  - hooks/docs_render.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Table One (tableone):
      - Overview: tableone/overview.md
  - Models:
      - Overview: models/overview.md
      - Quickstart: models/quickstart.md
      - Wilkinson formula: models/formula.md
      - vs R packages: models/vs-r.md
      - Benchmarks: models/benchmarks.md
  - Figures (viz):
      - Overview: viz/overview.md
  - Cost-effectiveness (cea):
      - Overview: cea/overview.md
      - Quickstart: cea/quickstart.md
      - vs R packages: cea/vs-r.md
      - Sick-Sicker example: examples/cea_sicksicker.md
  - Examples:
      - Gallery: examples/index.md
      - Gallery policy: examples/policy.md
      - surv_colon: examples/surv_colon.md
      - logit_indo: examples/logit_indo.md
      - psm_rhc: examples/psm_rhc.md
      - cif_pbc: examples/cif_pbc.md
      - aft_rotterdam: examples/aft_rotterdam.md
      - cox_retinopathy: examples/cox_retinopathy.md
      - lmm_pbcseq: examples/lmm_pbcseq.md
      - iptw_nhefs: examples/iptw_nhefs.md
      - pred_support: examples/pred_support.md
      - cea_sicksicker: examples/cea_sicksicker.md
  - API Reference:
      - Table One:
          - tableone: api/tableone/tableone.md
          - agg: api/tableone/agg.md
          - stat: api/tableone/stat.md
      - Models:
          - formula: api/models/formula.md
          - fit: api/models/fit.md
          - covariance: api/models/covariance.md
          - linear_tests: api/models/linear_tests.md
          - surv: api/models/surv.md
          - matching: api/models/matching.md
          - gam: api/models/gam.md
          - tree: api/models/tree.md
          - mixed: api/models/mixed.md
          - regression: api/models/regression.md
          - confusion: api/models/confusion.md
          - r: api/models/r.md
      - Figures:
          - forest: api/viz/forest.md
          - survival: api/viz/survival.md
          - figure: api/viz/figure.md
      - Cost-effectiveness:
          - markov: api/cea/markov.md
          - summarize: api/cea/summarize.md
          - sensitivity: api/cea/sensitivity.md
  - Development:
      - Benchmark plan: dev/benchmark-plan.md
      - Speed plan: dev/speed-plan.md
      - R parity plan: dev/r-parity-plan.md
      - R bridge plan: dev/r-lazy-plan.md
