[project]
name = "statract"
version = "0.1.0"
description = "Estimation, statistical figures, and cost-effectiveness analysis on Polars"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MIZUGUCHI Yasuhiko", email = "mizugy@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "great-tables>=0.20.0",
    "japanize-matplotlib>=1.1.3",
    "lme-python>=0.2.6",
    "matplotlib>=3.9.0",
    "numba>=0.61.0",
    "numpy>=2.4.0",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    "polars>=1.36.0",
    "scipy>=1.16.3",
    "setuptools>=75.0.0",
]

[project.optional-dependencies]
r = [
    "rpy2>=3.6.4",
    "rpy2-arrow>=0.1.3",
]
gpboost = [
    "gpboost>=1.6.4.2",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
