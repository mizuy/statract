name: Books bootstrap (temporary)
on:
  push:
    branches: [claude/project-thread-dbhj7p]
    paths: [books.yaml, tools/books.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with pyyaml python tools/books.py fetch
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books.lock.json
          git commit -m "Update books.lock.json from NDL"
          git push
