version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write psm_rhc_out artifacts
    deps:
      - build
    sources:
      - psm_rhc.py
      - psm_rhc_concept.md
      - psm_rhc_protocol.md
      - psm_rhc_results.md
    cmds:
      - '{{.PYTHON}} psm_rhc.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData psm_rhc_out
