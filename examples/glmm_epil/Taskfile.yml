version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write glmm_epil_out artifacts
    deps:
      - build
    sources:
      - glmm_epil.py
    cmds:
      - '{{.PYTHON}} glmm_epil.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData glmm_epil_out
