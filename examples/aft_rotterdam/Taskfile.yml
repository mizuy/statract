version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write aft_rotterdam_out artifacts
    deps:
      - build
    sources:
      - aft_rotterdam.py
      - aft_rotterdam_concept.md
      - aft_rotterdam_protocol.md
      - aft_rotterdam_results.md
    cmds:
      - '{{.PYTHON}} aft_rotterdam.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData aft_rotterdam_out
