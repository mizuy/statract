version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write cox_retinopathy_out artifacts
    deps:
      - build
    sources:
      - cox_retinopathy.py
      - cox_retinopathy_concept.md
      - cox_retinopathy_protocol.md
      - cox_retinopathy_results.md
    cmds:
      - '{{.PYTHON}} cox_retinopathy.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData cox_retinopathy_out
