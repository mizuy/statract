version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write surv_colon_out artifacts
    deps:
      - build
    sources:
      - surv_colon.py
      - surv_colon_concept.md
      - surv_colon_protocol.md
      - surv_colon_results.md
    cmds:
      - '{{.PYTHON}} surv_colon.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData surv_colon_out
