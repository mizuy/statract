version: '3'

vars:
  PYTHON: PYTHONPATH=. uv run python

tasks:
  build:
    desc: Build analysis-ready cache from snapshot
    sources:
      - build.py
    generates:
      - cache/build
    cmds:
      - '{{.PYTHON}} build.py'

  analysis:
    desc: Run analysis and write logit_indo_out artifacts
    deps:
      - build
    sources:
      - logit_indo.py
      - logit_indo_concept.md
      - logit_indo_protocol.md
      - logit_indo_results.md
    cmds:
      - '{{.PYTHON}} logit_indo.py'

  all:
    desc: Build cache and run analysis
    deps:
      - analysis

  clear:
    desc: Remove derived cache and analysis artifacts
    cmds:
      - rm -rf cache/build cache/build.RData logit_indo_out
