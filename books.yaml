# One entry per book; the order here is the order in manual_entries.bib.
# The fields are what the reference list prints. Every book needs an ISBN:
#   isbn: 9784000058421
#   isbn: {上: 9784254122916, 下: 9784254122923}   # one entry, several volumes
# Japanese editions write edition as 第 N 版 and set langid: japanese.
#
# task books:add -- KEY ISBN   fetch from NDL and print an entry to paste here
# task books:fetch             record NDL / openBD data in books.lock.json
# task books:build             regenerate manual_entries.bib
# task books:check             compare with books.lock.json (CI runs this)
